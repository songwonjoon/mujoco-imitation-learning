[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mujoco-imitation-learning"
dynamic = ["version"]
description = "Training and Evaluation of Vision-Language-Action Models on Mobile ALOHA"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
dependencies = [
    "anyio>=4.0.0",
    "imageio[ffmpeg]",      # Streaming mp4 writer for benchmarks/video.py
    "jsonargparse[signatures]>=4.36",  # class-signature-driven argparse + yaml
    "lazyregistry>=0.4.0",  # Python 3.8 support
    "msgpack>=1.0.0",
    "numpy>=1.24",
    "omegaconf",
    "pillow>=9.4.0",        # PIL.Image.ExifTags introduced in 9.4.0
    "pyyaml>=6.0",          # Security fixes (CVE-2020-14343) + Python 3.11
    "rich>=13.0",
    "tqdm",
    "typing_extensions>=4.0; python_version < '3.11'",  # NotRequired backport for results/collector.py
    "websockets>=12.0",
    "torchvision",
    "torch",
    "pyquaternion",
    "rospkg",
    "pexpect",
    "mujoco==2.3.7",
    "dm_control==1.0.14",
    "opencv-python",
    "matplotlib",
    "einops",
    "packaging",
    "h5py",
    "ipython",
    "qwen_vl_utils",
    "trl",
    "bitsandbytes>=0.43.0",
    "accelerate",
    "peft",
]

[dependency-groups]
dev = ["jsonschema>=4.0", "pytest>=8.0", "ruff>=0.9", "ty>=0.0.18"]
leaderboard = [
    "beautifulsoup4>=4.12",
    "markdownify>=0.14",
    "typer>=0.12",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mujoco_imitation_learning/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mujoco_imitation_learning"]

[project.scripts]
vla-eval = "mujoco_imitation_learning.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests", "leaderboard/tests"]

[tool.uv]
exclude-newer = "2026-08-13"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
unresolved-import = "ignore"